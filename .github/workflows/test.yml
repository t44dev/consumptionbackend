name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build & Install
        run: |
          uv sync --all-extras --dev
          uv pip install .

      - name: Run tests
        run: uv run python -m unittest discover -s tests
